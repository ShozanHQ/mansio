name: e2e
description: >-
  Start the compose stack and run the end-to-end suite against Iggy. The e2e job
  of ci.yml and the weekly run against Iggy's edge build in scheduled.yml both
  use it, so that they run the same thing. The caller checks out the repository,
  installs the toolchain and sets up the cache first.

runs:
  using: composite
  steps:
    - name: Settings of the throwaway stack on the runner
      shell: bash
      run: |
        {
          # Development values for a throwaway stack on the runner.
          echo MANSIO_TOKEN=ci-e2e-token
          echo MANSIO_E2E_URL=http://127.0.0.1:7070
          # Iggy itself, which the credential tests ask directly what a
          # credential may do. Without it they fail.
          echo MANSIO_E2E_IGGY_ADDRESS=127.0.0.1:8090
          # Seconds-scale work settings, so that a lease, a backoff and an alert
          # interval take seconds. The tests read them from GET /v1/settings.
          echo MANSIO_LEASE_SECONDS=2
          echo MANSIO_MAX_ATTEMPTS=3
          echo MANSIO_BACKOFF_BASE_SECONDS=1
          echo MANSIO_BACKOFF_CAP_SECONDS=4
          echo MANSIO_ALERT_RESURFACE_SECONDS=2
          echo MANSIO_TICK_MILLIS=200
          # Above Iggy's payload cap of 64 000 000 bytes, so that a body over
          # the cap reaches Iggy and oversized.rs sees what Iggy answers (the
          # default, 1 MiB, would be a 413 first).
          echo MANSIO_MAX_BODY_BYTES=100000000
          # A key is remembered for 10 s and a tenant keeps 20, so that the tests
          # of the window and of the bound take seconds.
          echo MANSIO_IDEMPOTENCY_WINDOW_SECONDS=10
          echo MANSIO_IDEMPOTENCY_MAX_KEYS=20
          # An agent credential lasts seconds, is checked with Iggy every 2 s,
          # and the sweep runs every 2 s.
          echo MANSIO_AGENT_CREDENTIAL_TTL_SECONDS=5
          echo MANSIO_CREDENTIAL_RECHECK_SECONDS=2
          echo MANSIO_CREDENTIAL_SWEEP_SECONDS=2
          # Streams look for new messages every 100 ms and send a comment every
          # second when quiet. A webhook retries after 1 s, 2 s, 4 s, gives up on
          # a delivery after 3 attempts, and waits 2 s for an answer.
          echo MANSIO_STREAM_POLL_MILLIS=100
          echo MANSIO_SSE_KEEPALIVE_SECONDS=1
          # Tests run in parallel with one bootstrap token: leave room for
          # their streams. The limits are tested on the in-process server.
          echo MANSIO_SSE_MAX_PER_CREDENTIAL=100
          echo MANSIO_WEBHOOK_BACKOFF_BASE_SECONDS=1
          echo MANSIO_WEBHOOK_BACKOFF_CAP_SECONDS=4
          echo MANSIO_WEBHOOK_MAX_ATTEMPTS=3
          echo MANSIO_WEBHOOK_TIMEOUT_SECONDS=2
          # The receiver is on the runner, which the container reaches at a
          # private address, and a rotated secret is honoured for 4 s.
          echo MANSIO_WEBHOOK_ALLOW_PRIVATE_DESTINATIONS=true
          echo MANSIO_WEBHOOK_ROTATION_GRACE_SECONDS=4
          # The name mansio-server, in its container, reaches the webhook
          # receiver of the tests by. The receiver listens on the runner.
          echo MANSIO_E2E_WEBHOOK_HOST=host.docker.internal
          # Iggy's cleaner looks for expired segments this often (a minute by
          # default), for the retention test further down.
          echo IGGY_DATA_MAINTENANCE_MESSAGES_INTERVAL=2s
        } >> "$GITHUB_ENV"
    - name: A directory for the sink that the container can write and the tests can read
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/mansio-sink"
        chmod 777 "$RUNNER_TEMP/mansio-sink"
        echo "MANSIO_SINK_DIR=$RUNNER_TEMP/mansio-sink" >> "$GITHUB_ENV"
        echo "MANSIO_E2E_SINK_PATH=$RUNNER_TEMP/mansio-sink/sink.jsonl" >> "$GITHUB_ENV"
    - name: A directory for what the two-pass tests leave for each other
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/mansio-state"
        echo "MANSIO_E2E_STATE_DIR=$RUNNER_TEMP/mansio-state" >> "$GITHUB_ENV"
    # The image is built here, before compose, so that the build can use GitHub's
    # Actions cache and be timed on its own. compose finds mansio-server:dev and
    # does not build it again. The cache is scoped per branch: a run writes its
    # branch's scope and reads it, then main's. The weekly run in scheduled.yml
    # runs on main, so it shares main's scope and this code.
    - name: Name the cache scope and start the clock
      id: cache
      shell: bash
      env:
        REF_NAME: ${{ github.ref_name }}
      run: |
        scope="mansio-server-$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
        echo "scope=$scope" >> "$GITHUB_OUTPUT"
        echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
    - name: Set up Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Build the mansio-server image, reusing the cached dependency layer
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        load: true
        push: false
        tags: mansio-server:dev
        cache-from: |
          type=gha,scope=${{ steps.cache.outputs.scope }}
          type=gha,scope=mansio-server-main
        cache-to: type=gha,mode=max,scope=${{ steps.cache.outputs.scope }}
    - name: Time the image build step
      shell: bash
      env:
        STARTED: ${{ steps.cache.outputs.started }}
      run: |
        elapsed=$(( $(date +%s) - STARTED ))
        echo "Image build step: ${elapsed}s"
        echo "Image build step: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"
    - name: Start Iggy, make mansio's Iggy user, and start mansio-server
      shell: bash
      run: docker compose up --wait
    - name: Publish, poll, claim, retry, acknowledge, stream, deliver webhooks and issue credentials through Iggy
      shell: bash
      run: cargo test -p mansio-e2e --locked
    # The two-pass tests: a first pass leaves work and alerts in Iggy, the
    # server is restarted, and a second pass checks what the new server made
    # of them. They are #[ignore]d and selected by name, and they fail
    # without a live server and a state directory.
    - name: A server with pages of 5, a lease of 30 s, a segment of 1 MiB, alerts and presence kept 5 s and keys kept 10 min
      shell: bash
      run: |
        # Set here, in the command's own environment, over the 2 s lease above.
        export MANSIO_LEASE_SECONDS=30
        export MANSIO_POLL_DEFAULT_COUNT=5
        export MANSIO_POLL_MAX_COUNT=5
        export MANSIO_IGGY_SEGMENT_SIZE_BYTES=1048576
        export MANSIO_RETENTION_ALERTS_SECONDS=5
        # presence has its own segment setting, set here so the run uses it. It is
        # 512 bytes over the general one, close enough that the e2e rolls both
        # after the same fillers: the unit tests in config.rs and the server
        # check which setting each kind of topic takes, not this step.
        export MANSIO_IGGY_PRESENCE_SEGMENT_SIZE_BYTES=1049088
        export MANSIO_RETENTION_PRESENCE_SECONDS=5
        # Long enough that a key outlasts the restart below.
        export MANSIO_IDEMPOTENCY_WINDOW_SECONDS=600
        docker compose up --detach --wait --no-deps --force-recreate mansio-server
    - name: Retention, first pass (alerts lose their head to Iggy, then another is published)
      shell: bash
      run: cargo test -p mansio-e2e --locked -- --ignored retention_first_pass
    - name: Presence retention (a heartbeat is gone after its retention and one segment roll)
      shell: bash
      run: cargo test -p mansio-e2e --locked -- --ignored presence_retention
    - name: Restart, first pass (a queue longer than a page, one item claimed)
      shell: bash
      run: cargo test -p mansio-e2e --locked -- --ignored restart_first_pass
    - name: Idempotency, first pass (a publish with a key)
      shell: bash
      run: cargo test -p mansio-e2e --locked -- --ignored idempotency_first_pass
    - name: Restart mansio-server and wait for /healthz
      shell: bash
      run: |
        docker compose restart mansio-server
        for _ in $(seq 1 240); do
          if curl --fail --silent --max-time 2 --output /dev/null "$MANSIO_E2E_URL/healthz"; then
            exit 0
          fi
          sleep 0.5
        done
        echo "::error::mansio-server did not answer /healthz after the restart"
        exit 1
    - name: Restart, retention and idempotency, second pass (the lease holds, the retry happens once, the alerts are known, the key answers with the first)
      shell: bash
      run: cargo test -p mansio-e2e --locked -- --ignored restart_second_pass retention_second_pass idempotency_second_pass
    # Two servers on the one Iggy, sharing tenants (README, "More than one
    # server per broker"). Both run with an owner ttl of 6 s. The first pass
    # races pulls over both servers and leaves work behind; the job kills
    # whichever server owns the tenant, with no warning; the second pass checks
    # that the other took the tenant within the ttl and that no item was lost.
    - name: Two servers on one Iggy, with an owner ttl of 6 s
      shell: bash
      run: |
        export MANSIO_OWNER_TTL_SECONDS=6
        docker compose --profile ha up --detach --wait --no-deps --force-recreate mansio-server mansio-server-b
        echo MANSIO_E2E_URL_B=http://127.0.0.1:7071 >> "$GITHUB_ENV"
    - name: Pulls spread over both servers lease no item twice
      shell: bash
      run: cargo test -p mansio-e2e --locked -- ha::two_servers_never_lease
    - name: Shared tenants, first pass (a race for a tenant, then work left behind)
      shell: bash
      run: cargo test -p mansio-e2e --locked -- --ignored ha_first_pass
    - name: Kill the server that owns the tenant
      shell: bash
      run: |
        owner="$(jq -r .owner_service "$MANSIO_E2E_STATE_DIR/ha.json")"
        echo "killing $owner"
        docker compose --profile ha kill "$owner"
        # The second pass holds the handover to the ttl from this moment.
        echo "MANSIO_E2E_KILLED_AT_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
    - name: Shared tenants, second pass (the other server takes the tenant over and no item is dropped)
      shell: bash
      run: cargo test -p mansio-e2e --locked -- --ignored ha_second_pass
    - name: Compose logs
      if: failure()
      shell: bash
      run: docker compose --profile ha logs --no-color
    - name: Stop the stack
      if: always()
      shell: bash
      run: docker compose --profile ha down --volumes
