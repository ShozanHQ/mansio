# Dependabot version updates, weekly. Minor and patch updates of an ecosystem
# arrive as one pull request; a major update arrives on its own, so that it is
# read on its own. Security updates are separate and not held back by this.
version: 2

updates:
  # Rust crates. Cargo.lock is kept in step.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      # A minor bump of the iggy SDK is breaking for a 0.x crate, so it gets its
      # own pull request. A dependency joins the first group it matches, so this
      # one comes before the catch-all; iggy patches still go with the rest.
      cargo-iggy-minor:
        patterns: ["iggy*"]
        update-types: [minor]
      cargo-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # The actions in the workflows. The versions are in comments beside the
  # commits they are pinned to, and Dependabot moves both. The second directory
  # covers the local e2e action, which uses the Buildx and build-push actions.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # The images in the Dockerfile, pinned by digest with the tag kept beside it.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # The compiler is whatever rust-toolchain.toml names; the rust image only
      # hosts rustup. Its tag is held at the current minor so the base does not
      # churn for nothing. Patch releases and a new digest of the same tag still come.
      - dependency-name: rust
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  # The image of Iggy in compose.yaml, the same way.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compose-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
