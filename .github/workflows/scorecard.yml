name: scorecard

# OpenSSF Scorecard of this repository: on every push to main, weekly, and when
# the branch protection rules change. The results go to code scanning and,
# because the repository is public, to the Scorecard API behind the badge in
# the README. Scorecard refuses to publish from a workflow that has anything
# but its own steps, so this one is kept to the usual four.

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    # Mondays, 04:29 UTC.
    - cron: "29 4 * * 1"

permissions: read-all

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-latest
    permissions:
      # Upload the results to code scanning.
      security-events: write
      # Publish the results to the Scorecard API, signed with this job's identity.
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Keep the SARIF file with the run for a few days
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
