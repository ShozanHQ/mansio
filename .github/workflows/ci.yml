name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked

  deny:
    name: deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features --locked

  # The guarantee (README, "The guarantee"): a consumer killed while idle, and
  # one killed holding a lease, and every item done exactly once. It has a
  # compose stack of its own, so it does not wait for the e2e job.
  offline:
    name: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Development values for a throwaway stack on the runner.
      MANSIO_TOKEN: ci-offline-token
      MANSIO_URL: http://127.0.0.1:7070
      # A lease and a backoff of seconds, so that scenario 2 takes about half a
      # minute. The lease is long against a consumer's pull and ack, which take
      # milliseconds. The test reads them from GET /v1/settings.
      MANSIO_LEASE_SECONDS: "8"
      MANSIO_MAX_ATTEMPTS: "3"
      MANSIO_BACKOFF_BASE_SECONDS: "1"
      MANSIO_BACKOFF_CAP_SECONDS: "4"
      MANSIO_TICK_MILLIS: "200"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shellcheck the test and its consumer, if the runner has shellcheck
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck tests/offline/*.sh
          else
            echo "::warning::shellcheck is not on the runner, so tests/offline/*.sh were not checked"
          fi
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the mansio command line
        run: cargo build -p mansio --locked
      - name: Start Iggy, make mansio's Iggy user, and start mansio-server
        run: docker compose up --build --wait
      - name: Kill a consumer while idle, kill one holding a lease, and check every item is done once
        env:
          MANSIO_BIN: ${{ github.workspace }}/target/debug/mansio
        run: tests/offline/run.sh
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  hygiene:
    name: hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commits of a pull request, for the check of their messages.
          fetch-depth: 0
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      # What the check looks for, and the one address it lets through, are in
      # the script. Its patterns are built from pieces, so it does not match
      # itself.
      - name: Nothing in the tree refers to how mansio is built
        run: bash .github/scripts/names.sh tree
      - name: Nor does a commit message, or the title or body of the pull request
        if: github.event_name == 'pull_request'
        # The title and the body are text of anyone who can open a pull request.
        # They reach the script through the environment and are never part of it.
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          failed=0
          printf '%s\n' "$TITLE" | bash .github/scripts/names.sh text "the pull request title" || failed=1
          printf '%s\n' "$BODY" | bash .github/scripts/names.sh text "the pull request body" || failed=1
          commits=$(git rev-list "$BASE..$HEAD")
          for commit in $commits; do
            git log -1 --format=%B "$commit" | bash .github/scripts/names.sh text "commit $commit" || failed=1
          done
          exit "$failed"
      - name: Every crate is Apache-2.0
        run: |
          metadata=$(cargo metadata --format-version 1 --no-deps --locked)
          crates=$(jq '.packages | length' <<<"$metadata")
          if [ "$crates" -lt 5 ]; then
            echo "::error::expected at least 5 crates, found $crates"
            exit 1
          fi
          others=$(jq -r '.packages[] | select(.license != "Apache-2.0") | .name' <<<"$metadata")
          if [ -n "$others" ]; then
            echo "::error::crates not licensed Apache-2.0: $others"
            exit 1
          fi

  # The steps and the settings of the throwaway stack are in
  # .github/actions/e2e, which the weekly run against Iggy's edge build in
  # scheduled.yml uses too.
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Start Iggy and mansio-server, run the end-to-end suite through compose, stop the stack
        uses: ./.github/actions/e2e
