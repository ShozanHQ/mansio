# A development stack: Apache Iggy and mansio-server.
#
#   docker compose up --build --wait
#
# mansio-server never acts as Iggy's root user. A one-shot service, iggy-admin,
# signs in as root once and makes the Iggy user mansio-server acts as: it manages
# users and streams and reads and writes topics, and nothing else. Only Iggy and
# iggy-admin are given the root password.
#
# The credentials below are DEVELOPMENT DEFAULTS. They are fine on a machine
# you trust and nowhere else. To use your own, set the variables in the
# environment or in a .env file next to this one:
#
#   MANSIO_TOKEN         the admin bearer token clients present to mansio-server
#   IGGY_ROOT_USERNAME   Iggy's root user, for Iggy and iggy-admin only
#   IGGY_ROOT_PASSWORD   its password; Iggy sets it on first start only, so
#                        change it before the first start or remove the
#                        iggy-data volume
#   MANSIO_IGGY_USERNAME the Iggy user mansio-server acts as
#   MANSIO_IGGY_PASSWORD its password; set when iggy-admin makes the user, so
#                        change it before the first start or remove the
#                        iggy-data volume
#
# The work and credential settings, and a few more that tests turn down, can be
# set the same way. Empty means the default:
#
#   MANSIO_LEASE_SECONDS, MANSIO_LEASE_MAX_SECONDS, MANSIO_MAX_ATTEMPTS,
#   MANSIO_BACKOFF_BASE_SECONDS, MANSIO_BACKOFF_CAP_SECONDS,
#   MANSIO_ALERT_RESURFACE_SECONDS, MANSIO_TICK_MILLIS,
#   MANSIO_POLL_DEFAULT_COUNT, MANSIO_POLL_MAX_COUNT,
#   MANSIO_IGGY_SEGMENT_SIZE_BYTES, MANSIO_RETENTION_ALERTS_SECONDS,
#   MANSIO_AGENT_CREDENTIAL_TTL_SECONDS, MANSIO_CREDENTIAL_RECHECK_SECONDS,
#   MANSIO_CREDENTIAL_SWEEP_SECONDS, MANSIO_STREAM_POLL_MILLIS,
#   MANSIO_SSE_KEEPALIVE_SECONDS, MANSIO_SHUTDOWN_GRACE_SECONDS,
#   MANSIO_WEBHOOK_BACKOFF_BASE_SECONDS,
#   MANSIO_WEBHOOK_BACKOFF_CAP_SECONDS, MANSIO_WEBHOOK_MAX_ATTEMPTS,
#   MANSIO_WEBHOOK_TIMEOUT_SECONDS, MANSIO_WEBHOOK_URL_MAX_BYTES
#
# A webhook to a program on the host is reached from the container as
# host.docker.internal, which the mansio-server service maps to the host.
#
# On start mansio-server replays the topics of every tenant before it answers
# anything, /healthz included, so a big log keeps /healthz dark for a while.
# If the registry of principals cannot be loaded (the broker could not be read,
# or a record of it cannot) /healthz answers 503 "degraded", so the health
# check fails and the stack is not healthy: the cause is in the server's log.
# Docker ignores failed health checks during the start period of the check
# (60s here), and the first one that passes ends it. For a log that takes
# longer to replay than that, set MANSIO_HEALTH_START_PERIOD, for example 5m.
#
# Iggy removes expired messages in a pass every IGGY_DATA_MAINTENANCE_MESSAGES_INTERVAL
# (a minute by default). Only the retention test turns it down.
#
# The sink file lives in the "sink" volume. To keep it in a directory on the
# host instead, so that something outside the container can read it, set
# MANSIO_SINK_DIR to an absolute path the container's user (uid 10001) can
# write to.
#
# mansio-server and Iggy's TCP port are published, and only on loopback. The
# end-to-end tests ask Iggy itself what a credential may do, which needs the
# port; set IGGY_PORT if 8090 is taken.

name: mansio

services:
  iggy:
    image: apache/iggy:0.9.0
    restart: unless-stopped
    # What Iggy's io_uring runtime needs, as in Iggy's own compose file.
    cap_add:
      - SYS_NICE
    security_opt:
      - seccomp:unconfined
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      IGGY_ROOT_USERNAME: ${IGGY_ROOT_USERNAME:-iggy}
      IGGY_ROOT_PASSWORD: ${IGGY_ROOT_PASSWORD:-iggy}
      IGGY_PATH: local_data
      IGGY_DATA_MAINTENANCE_MESSAGES_INTERVAL: ${IGGY_DATA_MAINTENANCE_MESSAGES_INTERVAL:-1 m}
      # The image binds loopback unless told otherwise.
      IGGY_TCP_ADDRESS: 0.0.0.0:8090
      # The name other containers reach it by.
      IGGY_NODE_ADVERTISED_ADDRESS: iggy
    ports:
      - "127.0.0.1:${IGGY_PORT:-8090}:8090"
    volumes:
      - iggy-data:/app/local_data
    healthcheck:
      test: ["CMD", "/usr/local/bin/iggy", "--tcp-server-address", "127.0.0.1:8090", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 2s

  # Runs once and stops: makes the Iggy user mansio-server acts as, or sets its
  # permissions again if it exists.
  iggy-admin:
    build: &mansio-build
      context: .
      dockerfile: Dockerfile
    image: mansio-server:dev
    command: ["provision-admin"]
    restart: "no"
    depends_on:
      iggy:
        condition: service_healthy
    environment:
      MANSIO_IGGY_ADDRESS: iggy:8090
      IGGY_ROOT_USERNAME: ${IGGY_ROOT_USERNAME:-iggy}
      IGGY_ROOT_PASSWORD: ${IGGY_ROOT_PASSWORD:-iggy}
      MANSIO_IGGY_USERNAME: ${MANSIO_IGGY_USERNAME:-mansio}
      MANSIO_IGGY_PASSWORD: ${MANSIO_IGGY_PASSWORD:-mansio-dev-admin}

  mansio-server:
    build: *mansio-build
    image: mansio-server:dev
    restart: unless-stopped
    depends_on:
      iggy:
        condition: service_healthy
      iggy-admin:
        condition: service_completed_successfully
    environment:
      MANSIO_BROKER: iggy
      MANSIO_TOKEN: ${MANSIO_TOKEN:-mansio-dev-token}
      MANSIO_IGGY_ADDRESS: iggy:8090
      MANSIO_IGGY_USERNAME: ${MANSIO_IGGY_USERNAME:-mansio}
      MANSIO_IGGY_PASSWORD: ${MANSIO_IGGY_PASSWORD:-mansio-dev-admin}
      MANSIO_LEASE_SECONDS: ${MANSIO_LEASE_SECONDS:-}
      MANSIO_LEASE_MAX_SECONDS: ${MANSIO_LEASE_MAX_SECONDS:-}
      MANSIO_MAX_ATTEMPTS: ${MANSIO_MAX_ATTEMPTS:-}
      MANSIO_BACKOFF_BASE_SECONDS: ${MANSIO_BACKOFF_BASE_SECONDS:-}
      MANSIO_BACKOFF_CAP_SECONDS: ${MANSIO_BACKOFF_CAP_SECONDS:-}
      MANSIO_ALERT_RESURFACE_SECONDS: ${MANSIO_ALERT_RESURFACE_SECONDS:-}
      MANSIO_TICK_MILLIS: ${MANSIO_TICK_MILLIS:-}
      MANSIO_POLL_DEFAULT_COUNT: ${MANSIO_POLL_DEFAULT_COUNT:-}
      MANSIO_POLL_MAX_COUNT: ${MANSIO_POLL_MAX_COUNT:-}
      MANSIO_IGGY_SEGMENT_SIZE_BYTES: ${MANSIO_IGGY_SEGMENT_SIZE_BYTES:-}
      MANSIO_RETENTION_ALERTS_SECONDS: ${MANSIO_RETENTION_ALERTS_SECONDS:-}
      MANSIO_AGENT_CREDENTIAL_TTL_SECONDS: ${MANSIO_AGENT_CREDENTIAL_TTL_SECONDS:-}
      MANSIO_CREDENTIAL_RECHECK_SECONDS: ${MANSIO_CREDENTIAL_RECHECK_SECONDS:-}
      MANSIO_CREDENTIAL_SWEEP_SECONDS: ${MANSIO_CREDENTIAL_SWEEP_SECONDS:-}
      MANSIO_STREAM_POLL_MILLIS: ${MANSIO_STREAM_POLL_MILLIS:-}
      MANSIO_SSE_KEEPALIVE_SECONDS: ${MANSIO_SSE_KEEPALIVE_SECONDS:-}
      MANSIO_SHUTDOWN_GRACE_SECONDS: ${MANSIO_SHUTDOWN_GRACE_SECONDS:-}
      MANSIO_WEBHOOK_BACKOFF_BASE_SECONDS: ${MANSIO_WEBHOOK_BACKOFF_BASE_SECONDS:-}
      MANSIO_WEBHOOK_BACKOFF_CAP_SECONDS: ${MANSIO_WEBHOOK_BACKOFF_CAP_SECONDS:-}
      MANSIO_WEBHOOK_MAX_ATTEMPTS: ${MANSIO_WEBHOOK_MAX_ATTEMPTS:-}
      MANSIO_WEBHOOK_TIMEOUT_SECONDS: ${MANSIO_WEBHOOK_TIMEOUT_SECONDS:-}
      MANSIO_WEBHOOK_URL_MAX_BYTES: ${MANSIO_WEBHOOK_URL_MAX_BYTES:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:7070:7070"
    volumes:
      - ${MANSIO_SINK_DIR:-sink}:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:7070/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      # A start replays every tenant's topics before the server answers, and
      # /healthz is dark until it has. Failures in this period do not count.
      start_period: ${MANSIO_HEALTH_START_PERIOD:-60s}

volumes:
  iggy-data:
  sink:
