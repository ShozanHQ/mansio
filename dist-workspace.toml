# cargo-dist builds the `mansio` command line. The workflow that runs it is
# .github/workflows/release.yml, written by hand, so dist generates no CI.
[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.30.0"
ci = []
installers = []
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
