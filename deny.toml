# cargo-deny: licences, advisories, bans and sources. Run in CI with
# `cargo deny check`.

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# Permissive licences only. A new dependency under another licence fails CI
# until the allowlist is changed on purpose.
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
