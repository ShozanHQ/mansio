# cargo-deny: licences, advisories, bans and sources. Run in CI with
# `cargo deny check`.

[graph]
all-features = true

[advisories]
yanked = "deny"
# Unmaintained advisories with no safe upgrade, acknowledged by id. Each
# entry is reviewed again on the date in its reason.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained with no safe upgrade; it comes in through iggy, the direct dependency of mansio-iggy (cargo tree -i chrono); look again on 2026-12-18." },
    { id = "RUSTSEC-2026-0542", reason = "humantime is unmaintained with no safe upgrade; it comes in through iggy, the direct dependency of mansio-iggy (cargo tree -i humantime); look again on 2026-12-18." },
]

[licenses]
# Permissive licences only. A new dependency under another licence fails CI
# until the allowlist is changed on purpose.
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

# libFuzzer is LLVM code under NCSA, a permissive OSI licence. Only the fuzz
# crate (fuzz/, never published) depends on it, so nothing mansio ships does.
[[licenses.exceptions]]
crate = "libfuzzer-sys"
allow = ["NCSA"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
