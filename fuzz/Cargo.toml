[package]
name = "mansio-fuzz"
description = "Fuzz targets for the decoders of untrusted input."
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

# Not a member of the root workspace: libFuzzer needs a nightly compiler, and
# the workspace builds on the pinned stable one. Its lockfile, fuzz/Cargo.lock, is committed and CI passes --locked.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
mansio-server = { path = "../crates/mansio-server", features = ["fuzzing"] }

[[bin]]
name = "envelope"
path = "fuzz_targets/envelope.rs"
test = false
doc = false
bench = false

